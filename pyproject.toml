[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autogds"
version = "0.1.0"
description = "AutoGDS: natural language to photonic layout (v1)."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "openai>=1.0"

]

[project.optional-dependencies]
layout = [
  "gdsfactory>=7.0",
  "sax>=0.12",
  "numpy>=1.24",
  "matplotlib>=3.7"
]

[project.scripts]
autogds = "autogds.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
